import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'io.github.ergoo.onelist'

    compileSdk 35

    defaultConfig {
        minSdk 10

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {

    compileOnly "androidx.recyclerview:recyclerview:1.4.0"
    compileOnly "androidx.databinding:viewbinding:9.2.1"
    compileOnly "androidx.paging:paging-runtime-ktx:3.5.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "androidx.test.ext:junit:1.3.0"
    testImplementation "androidx.recyclerview:recyclerview:1.4.0"
}

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

    signAllPublications()
}

